# Legacy Netlify config (site now primary on Cloudflare Pages via GitHub).
# Safe to keep for dual-host testing; Cloudflare ignores this file.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
