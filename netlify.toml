# Netlify / Cloudflare-compatible publish config
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Explicit SPA paths only — never /* → index.html
[[redirects]]
  from = "/meme"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/notes"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/journey"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/commands"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/vault"
  to = "/index.html"
  status = 200
