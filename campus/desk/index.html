<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>University Desk · Clarity University</title>
<meta name="description" content="Clarity University Desk — sequential modules. Educational only. Not a fatwa."/>
<link rel="canonical" href="https://clarity-dawah.fyi/campus/desk/"/>
<link rel="stylesheet" href="/assets/curriculum/vault/foundation/phase-plaque.css?v=20261011Q"/>
<style>
:root{--bg:#070c0a;--gold:#e0c56a;--teal:#1fa67a;--text:#eaf3ee;--muted:rgba(234,243,238,.75);--line:rgba(224,197,106,.3)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100%;width:100%}
body{background:radial-gradient(1100px 480px at 50% -8%,rgba(31,166,122,.12),transparent 55%),var(--bg)}
.banner{position:sticky;top:0;z-index:600;width:100%;display:flex;align-items:center;justify-content:space-between;padding:.55rem .8rem;background:rgba(8,16,14,.97);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:#f3e6c0}
.brand img{width:32px;height:32px;border-radius:50%;border:1px solid var(--line)}
.brand strong{font-size:1rem;font-weight:800}
.brand small{display:block;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.main-link{font-size:.72rem;font-weight:700;padding:.32rem .65rem;border-radius:999px;border:1px solid var(--line);background:rgba(224,197,106,.15);color:var(--gold);text-decoration:none}
.main{width:100%;padding:.7rem .6rem 2rem}
@media(min-width:640px){.main{padding:.85rem 1rem 2rem}}
.pills{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;width:100%;margin:0 0 .6rem}
.pills a{font-size:.74rem;font-weight:650;padding:.38rem .75rem;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#f3e6c0;text-decoration:none}
.pills a.here{background:rgba(224,197,106,.2);border-color:var(--gold)}
.roles{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;width:100%;margin:0 0 .7rem}
.roles button{font:inherit;font-size:.7rem;font-weight:650;padding:.3rem .65rem;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.32);color:#f3e6c0;cursor:pointer}
.roles button.on{background:rgba(31,166,122,.35);border-color:var(--teal)}
#clarity-phase-plaque-rail,.clarity-phase-plaque-rail{position:relative!important;top:auto!important;width:100%!important;margin:.4rem 0 .7rem!important;padding:.7rem .9rem!important;border-radius:12px!important;border:1px solid var(--line)!important;background:rgba(0,0,0,.25)!important;font-size:.78rem!important;line-height:1.45!important;z-index:1!important}
#clarity-phase-plaque-rail strong{color:var(--gold)}
.label{text-align:center;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:.4rem 0 .5rem}
#clarity-campus-stage,#campus-stage-body{display:block;width:100%;min-height:10rem}
#junior-curriculum-card{width:100%!important;max-width:none!important;margin:.3rem 0 1rem!important;padding:1rem!important;border-radius:16px!important;border:1px solid var(--line)!important;background:rgba(16,24,20,.95)!important}
.foot{text-align:center;font-size:.68rem;color:var(--muted);padding:1rem}
</style>
</head>
<body data-campus-page="desk" data-campus-stage="learn" data-campus-shell="1">
<header class="banner">
  <a class="brand" href="/campus/">
    <img src="/assets/curriculum/vault/admin/brand/clarity-university-insignia.svg" alt=""/>
    <div><small>University</small><strong>Clarity University</strong></div>
  </a>
  <a class="main-link" href="/">← Main</a>
</header>
<main class="main">
  <nav class="pills">
    <a href="/campus/">Map</a>
    <a class="here" href="/campus/desk/">Desk</a>
    <a href="/lab/">Lab</a>
    <a href="/vault/">Vault</a>
    <a href="/journey/">Journey</a>
    <a href="/charter/">Charter</a>
  </nav>
  <div class="roles" id="roles">
    <button type="button" data-role="faculty">Faculty</button>
    <button type="button" data-role="staff">Staff</button>
    <button type="button" data-role="it">IT</button>
    <button type="button" data-role="om">O&M</button>
    <button type="button" data-role="security">Security</button>
  </div>
  <p class="label">University Desk</p>
  <div id="clarity-campus-stage"><div id="campus-stage-body"></div></div>
</main>
<footer class="foot">Educational only — not a fatwa. Progress stays on this device.</footer>
<script src="/assets/curriculum/vault/boot.js?v=20261011Q" defer></script>
<script src="/assets/curriculum/vault/admin/campus/campus-shell-v1.js?v=20261011Q" defer></script>
<script src="/assets/clarity-campus-rescue-v1.js?v=20261011Q" defer></script>
<script src="/assets/curriculum/vault/admin/staff/role-injector-v1.js?v=20261011Q" defer></script>
<script>
function containPlaque(){
  var rail=document.getElementById("clarity-phase-plaque-rail");
  var main=document.querySelector(".main");
  if(rail&&main&&rail.parentNode!==main){
    var stage=document.getElementById("clarity-campus-stage");
    if(stage) main.insertBefore(rail,stage);
  }
}
document.addEventListener("DOMContentLoaded",function(){
  setTimeout(containPlaque,500);
  setTimeout(containPlaque,1500);
});
document.querySelectorAll("#roles button").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll("#roles button").forEach(function(x){x.classList.remove("on")});
    b.classList.add("on");
    try{window.dispatchEvent(new CustomEvent("clarity-role-activate",{detail:{id:b.dataset.role}}));}catch(e){}
  });
});
</script>
</body>
</html>
