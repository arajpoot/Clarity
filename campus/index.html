<!DOCTYPE html>
<html lang="en" data-theme="dark" data-campus-page="campus">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<title>Campus · Learning Stage · Clarity University</title>
<meta name="description" content="Clarity University learning stage — Junior pathway, phases, spark quizzes. Educational only."/>
<link rel="canonical" href="https://clarity-dawah.fyi/campus/"/>
<link rel="stylesheet" href="/assets/curriculum/vault/foundation/phase-plaque.css?v=20261010C22"/>
<link rel="stylesheet" href="/assets/curriculum/vault/admin/campus/campus-shell.css?v=20261010C22"/>
<style>
:root {
  --cu-bg: #070c0a;
  --cu-panel: rgba(18, 28, 24, 0.92);
  --cu-gold: #e0c56a;
  --cu-gold-dim: rgba(224, 197, 106, 0.35);
  --cu-teal: #1fa67a;
  --cu-text: #eaf3ee;
  --cu-muted: rgba(234, 243, 238, 0.72);
  --cu-line: rgba(224, 197, 106, 0.28);
  --cu-max: 56rem;
  --nav-h: 3.1rem;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--cu-bg) !important;
  color: var(--cu-text) !important;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  min-height: 100%;
}
body.cu-page {
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(31, 166, 122, 0.18), transparent 55%),
    radial-gradient(800px 400px at 100% 20%, rgba(224, 197, 106, 0.08), transparent 50%),
    var(--cu-bg) !important;
}

/* —— Nav —— */
.cu-map-nav {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: rgba(8, 16, 14, 0.85);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--cu-line);
  position: sticky; top: 0; z-index: 100;
  min-height: var(--nav-h);
}
.cu-map-brand {
  color: #f3e6c0; font-weight: 800; text-decoration: none; font-size: 0.95rem;
  letter-spacing: 0.02em; display: inline-flex; align-items: center; gap: 0.4rem;
}
.cu-map-brand::before {
  content: ""; width: 0.55rem; height: 0.55rem; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #e0c56a, #1fa67a);
  box-shadow: 0 0 10px rgba(31, 166, 122, 0.6);
}
.cu-map-links { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.cu-map-links a {
  color: var(--cu-muted); text-decoration: none; font-size: 0.76rem; font-weight: 600;
  padding: 0.32rem 0.65rem; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: border-color .2s, background .2s, color .2s;
}
.cu-map-links a[aria-current="page"],
.cu-map-links a:hover {
  background: rgba(224, 197, 106, 0.14);
  color: #f3e6c0;
  border-color: var(--cu-gold-dim);
}

/* —— Banner —— */
.cu-banner {
  position: relative;
  overflow: hidden;
  border-bottom: 1px solid var(--cu-line);
  min-height: 7.5rem;
}
.cu-banner-bg {
  position: absolute; inset: 0;
  background:
    linear-gradient(120deg, rgba(7,12,10,0.75), rgba(10,30,24,0.55)),
    url("https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Kaaba_Masjid_Haraam_Makkah.jpg/640px-Kaaba_Masjid_Haraam_Makkah.jpg")
      center 40% / cover no-repeat;
  filter: saturate(0.85);
}
.cu-banner-bg::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 120%, rgba(31,166,122,0.25), transparent 55%);
  pointer-events: none;
}
.cu-banner-arc {
  position: absolute; left: 50%; top: 20%;
  width: 140%; height: 180%;
  transform: translateX(-50%);
  border: 2px solid rgba(224, 197, 106, 0.22);
  border-radius: 50%;
  pointer-events: none;
  box-shadow: 0 0 40px rgba(224, 197, 106, 0.08) inset;
}
.cu-banner-inner {
  position: relative; z-index: 1;
  max-width: var(--cu-max);
  margin: 0 auto;
  padding: 1.15rem 1rem 1.25rem;
  text-align: center;
}
.cu-banner-kicker {
  font-size: 0.65rem; letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(224, 197, 106, 0.9); font-weight: 700; margin-bottom: 0.35rem;
}
.cu-banner h1 {
  margin: 0 0 0.35rem;
  font-size: clamp(1.25rem, 4vw, 1.65rem);
  font-weight: 800;
  color: #f7efd6;
  text-shadow: 0 2px 18px rgba(0,0,0,0.45);
}
.cu-banner p {
  margin: 0 auto;
  max-width: 32rem;
  font-size: 0.88rem;
  line-height: 1.45;
  color: rgba(234, 243, 238, 0.88);
}

/* —— Main width —— */
.cu-page-main {
  max-width: var(--cu-max);
  margin: 0 auto;
  padding: 1rem 1rem 4.5rem;
}

/* —— 22nd-c phase top card —— */
#clarity-phase-plaque-rail,
.clarity-phase-plaque-rail {
  position: relative !important;
  top: auto !important;
  z-index: 5 !important;
  margin: 0 0 1.1rem !important;
  padding: 0 !important;
  border: none !important;
  background: transparent !important;
  box-shadow: none !important;
}
.cpp-inner {
  max-width: none !important;
  margin: 0 !important;
  padding: 1rem 1.1rem 1.15rem !important;
  border-radius: 18px !important;
  border: 1px solid var(--cu-line) !important;
  background:
    linear-gradient(145deg, rgba(22, 36, 30, 0.98), rgba(12, 22, 18, 0.96)) !important;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.03) inset,
    0 16px 48px rgba(0,0,0,0.35),
    0 0 60px rgba(31, 166, 122, 0.06) !important;
  position: relative;
  overflow: hidden;
}
.cpp-inner::before {
  content: "";
  position: absolute; top: -40%; right: -20%;
  width: 55%; height: 120%;
  background: radial-gradient(circle, rgba(224,197,106,0.1), transparent 70%);
  pointer-events: none;
}
.cpp-how {
  position: relative;
  background: rgba(31, 166, 122, 0.08) !important;
  border: 1px solid rgba(31, 166, 122, 0.22) !important;
  border-radius: 14px !important;
  padding: 0.85rem 1rem !important;
  margin: 0 0 0.85rem !important;
  color: var(--cu-text) !important;
  font-size: 0.86rem !important;
  line-height: 1.5 !important;
}
.cpp-how strong {
  color: var(--cu-gold) !important;
  font-size: 0.78rem !important;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 0.4rem;
}
.cpp-how ol {
  margin: 0.15rem 0 0 1.15rem !important;
  padding: 0 !important;
  color: var(--cu-muted) !important;
  columns: 1;
}
@media (min-width: 640px) {
  .cpp-how ol { columns: 2; column-gap: 1.5rem; }
}
.cpp-how li { margin: 0.2rem 0; break-inside: avoid; color: inherit !important; }
.cpp-how li b { color: #c5e8d6 !important; font-weight: 700; }

.cpp-chips {
  display: grid !important;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.45rem !important;
  margin: 0.5rem 0 0.55rem !important;
}
@media (max-width: 520px) {
  .cpp-chips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.cpp-chip {
  display: flex !important;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.15rem;
  background: rgba(255,255,255,0.04) !important;
  border: 1px solid rgba(255,255,255,0.1) !important;
  color: var(--cu-text) !important;
  border-radius: 12px !important;
  padding: 0.55rem 0.6rem !important;
  font-size: 0.78rem !important;
  cursor: pointer;
  transition: transform .15s, border-color .2s, box-shadow .2s;
}
.cpp-chip:hover { transform: translateY(-1px); border-color: var(--cu-gold-dim) !important; }
.cpp-chip.cpp-active {
  border-color: rgba(224, 197, 106, 0.55) !important;
  background: linear-gradient(160deg, rgba(224,197,106,0.16), rgba(31,166,122,0.1)) !important;
  box-shadow: 0 0 0 1px rgba(224,197,106,0.15), 0 8px 20px rgba(0,0,0,0.2) !important;
  color: #f7efd6 !important;
}
.cpp-chip.cpp-locked { opacity: 0.5; }
.cpp-chip.cpp-done { border-color: rgba(31,166,122,0.4) !important; }
.cpp-num { font-weight: 800; font-size: 0.82rem; }
.cpp-extra, .cpp-now, .cpp-lock, .cpp-ok { font-size: 0.68rem; opacity: 0.85; }
.cpp-status {
  font-size: 0.8rem !important;
  color: var(--cu-muted) !important;
  margin-top: 0.35rem !important;
  padding-top: 0.45rem;
  border-top: 1px solid rgba(255,255,255,0.06);
}

/* Learner row if injected */
#clarity-name-plaque-rail, .cnp-inner {
  display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center;
  margin: 0 0 0.85rem;
}

/* Stage */
.campus-stage-label {
  font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--cu-gold); opacity: 0.9; margin: 0 0 0.55rem; font-weight: 700;
}
#campus-stage-body { min-height: 8rem; }

#junior-curriculum-card,
#junior-high-curriculum-card,
#daily-hs-curriculum-card,
#dai-university-curriculum-card,
.curriculum-phase-card {
  display: block !important;
  background: linear-gradient(165deg, rgba(20, 32, 26, 0.98), rgba(12, 20, 16, 0.96)) !important;
  color: var(--cu-text) !important;
  border: 1px solid var(--cu-line) !important;
  border-radius: 18px !important;
  padding: 1.15rem 1.2rem !important;
  margin: 0 0 1.35rem !important;
  box-shadow: 0 14px 40px rgba(0,0,0,0.3);
}
#junior-curriculum-card .card-title,
#junior-curriculum-card h2,
.curriculum-phase-card .card-title {
  color: var(--cu-gold) !important;
  font-size: 1.2rem !important;
  margin: 0 0 0.45rem !important;
  font-weight: 800 !important;
}
#junior-curriculum-card .card-lead,
#junior-curriculum-card p,
.junior-body, .curriculum-body { color: var(--cu-muted) !important; }
#junior-curriculum-card .junior-unit h3,
#junior-curriculum-card h3 { color: #c8e6d6 !important; }
#junior-curriculum-card .junior-module,
#junior-curriculum-card article {
  background: rgba(0,0,0,0.28) !important;
  border: 1px solid rgba(224,197,106,0.2) !important;
  border-radius: 14px !important;
  color: var(--cu-text) !important;
}
#junior-curriculum-card a { color: #e8c47a !important; }
#junior-curriculum-card button {
  color: #0c1410 !important;
  background: linear-gradient(135deg, #c9a227, #e8c47a) !important;
  border: none !important;
  border-radius: 999px !important;
  font-weight: 700 !important;
}

.cu-foot {
  text-align: center; font-size: 0.72rem; color: var(--cu-muted);
  padding: 1.5rem 0.5rem 0.5rem;
}
.cu-foot a { color: var(--cu-gold); text-decoration: none; }
.clarity-engine-hud { display: none !important; }
</style>
</head>
<body class="cu-page" data-campus-page="campus" data-campus-stage="learn">
<nav class="cu-map-nav" aria-label="Campus map">
  <a class="cu-map-brand" href="/">Clarity University</a>
  <div class="cu-map-links">
    <a href="/">Arrival</a>
    <a href="/campus/" aria-current="page">Campus</a>
    <a href="/lab/">Lab</a>
    <a href="/vault/">Amana Vault</a>
  </div>
</nav>

<header class="cu-banner" role="banner">
  <div class="cu-banner-bg" aria-hidden="true"></div>
  <div class="cu-banner-arc" aria-hidden="true"></div>
  <div class="cu-banner-inner">
    <div class="cu-banner-kicker">Nur Path · Sealed desk</div>
    <h1>Learning Stage</h1>
    <p>One module at a time. Spark quiz unlocks the next. Progress stays on this device — educational only.</p>
  </div>
</header>

<main class="cu-page-main">
  <div id="clarity-name-plaque-rail" class="cnp-inner" aria-label="Learner"></div>

  <p class="campus-stage-label">Phase desk</p>
  <div id="clarity-campus-stage">
    <div id="campus-stage-body">
      <p id="campus-loading-hint" style="opacity:.75;font-size:.88rem;color:rgba(234,243,238,.7)">Loading Junior desk…</p>
    </div>
  </div>

  <p class="cu-foot"><a href="/">Full companion</a> · <a href="/lab/">Lab</a> · <a href="/vault/">Vault</a><br/>Educational only — not a fatwa</p>
</main>

<script src="/assets/curriculum/vault/foundation/engine.js?v=20261010C22"></script>
<script src="/assets/curriculum/vault/foundation/spark-quiz.js?v=20261010C22"></script>
<script src="/assets/curriculum/vault/foundation/diplomas.js?v=20261010C22"></script>
<script src="/assets/curriculum/vault/foundation/phase-plaque.js?v=20261010C22"></script>
<script src="/assets/curriculum/vault/foundation/curriculum-controller.js?v=20261010C22"></script>
<script src="/assets/curriculum/vault/foundation/college-seeker.js?v=20261010C22"></script>
<script src="/assets/curriculum/vault/foundation/college-practice.js?v=20261010C22"></script>
<script src="/assets/curriculum/vault/foundation/college-consistency.js?v=20261010C22"></script>
<script src="/assets/curriculum/vault/foundation/college-transmission.js?v=20261010C22"></script>
<script src="/assets/curriculum/vault/admin/campus/campus-shell-v1.js?v=20261010C22" defer></script>
<script src="/assets/clarity-campus-rescue-v1.js?v=20261010C22" defer></script>
<script>
(function () {
  try { document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
  function adopt() {
    try {
      if (window.ClarityJuniorCurriculum && ClarityJuniorCurriculum.render) ClarityJuniorCurriculum.render();
      if (window.ClarityCampus && ClarityCampus.adoptCurriculumCards) ClarityCampus.adoptCurriculumCards();
    } catch (e) {}
    var h = document.getElementById("campus-loading-hint");
    if (h && document.getElementById("junior-curriculum-card")) h.remove();
    /* Move phase plaque into main flow above stage if it injected at body top */
    try {
      var rail = document.getElementById("clarity-phase-plaque-rail");
      var main = document.querySelector(".cu-page-main");
      var label = document.querySelector(".campus-stage-label");
      if (rail && main && label && rail.parentNode !== main) {
        main.insertBefore(rail, label);
      }
    } catch (e2) {}
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      setTimeout(adopt, 300); setTimeout(adopt, 1000); setTimeout(adopt, 2200);
    });
  } else {
    setTimeout(adopt, 300); setTimeout(adopt, 1000); setTimeout(adopt, 2200);
  }
})();
</script>
</body>
</html>
