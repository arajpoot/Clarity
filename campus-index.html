<script>
(function () {
  function hideHint() {
    var h = document.getElementById("campus-loading-hint");
    if (h && document.getElementById("junior-curriculum-card")) h.remove();
  }
  function adopt() {
    try {
      if (window.ClarityCampus && ClarityCampus.adoptCurriculumCards) ClarityCampus.adoptCurriculumCards();
      if (window.ClarityJuniorCurriculum && ClarityJuniorCurriculum.render) ClarityJuniorCurriculum.render();
      if (window.ClarityCampusPolish && ClarityCampusPolish.version) { /* warm */ }
    } catch (e) {}
    hideHint();
  }
  window.addEventListener("clarity-vault-ready", function () {
    setTimeout(adopt, 200);
    setTimeout(adopt, 800);
    setTimeout(adopt, 2000);
  });
  window.addEventListener("load", function () {
    setTimeout(adopt, 1500);
    setTimeout(adopt, 3500);
  });
  document.documentElement.setAttribute("data-campus-stage", "learn");
})();
</script>
