*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cu-bg);color:var(--cu-text);font-family:var(--cu-font);line-height:1.45}

.cu-brand img{width:1.5rem;height:1.5rem;border-radius:50%}
.cu-links{display:flex;flex-wrap:wrap;gap:.2rem}
.cu-links a{color:var(--cu-muted);text-decoration:none;font-size:.7rem;font-weight:650;padding:.3rem .55rem;border-radius:999px;border:1px solid transparent}
.cu-links a:hover{color:#f3e6c0;border-color:rgba(255,255,255,.1)}

.cu-main{max-width:var(--cu-max);margin:0 auto;padding:1.15rem 1rem 3.5rem}
.cu-hero h1{margin:0 0 .35rem;font-size:clamp(1.25rem,3vw,1.65rem);color:var(--cu-gold);font-weight:800}
.cu-hero p{margin:0;color:var(--cu-muted);font-size:.88rem;max-width:36rem}
.cu-pill{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:.18rem .5rem;border-radius:999px;background:rgba(31,166,122,.18);color:#8fdfc0;margin-bottom:.45rem}
.cu-grid{display:grid;gap:.55rem;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr))}
.cu-card{border:1px solid rgba(255,255,255,.08);border-radius:var(--cu-radius);padding:.85rem .95rem;
  background:linear-gradient(165deg,rgba(20,32,28,.95),rgba(10,16,14,.92));color:inherit;text-decoration:none;display:block;
  transition:border-color .15s,transform .15s}
.cu-card:hover{border-color:rgba(224,197,106,.4);transform:translateY(-1px)}
.cu-card strong{display:block;color:#f3e6c0;font-size:.88rem;margin-bottom:.15rem}
.cu-card span{font-size:.72rem;color:var(--cu-muted);line-height:1.35}
button.cu-card{width:100%;text-align:left;font:inherit;cursor:pointer}
.cu-stage{margin:1rem 0;padding:1rem;border-radius:var(--cu-radius);border:1px solid var(--cu-line);background:var(--cu-panel);min-height:12rem}
.cu-stage-label{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cu-gold);margin:0 0 .55rem;opacity:.9}
.cu-beacon{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .85rem}
.cu-beacon span{font-size:.68rem;padding:.22rem .5rem;border-radius:8px;border:1px solid rgba(255,255,255,.08);color:var(--cu-muted)}
.cu-beacon span.on{border-color:rgba(31,166,122,.45);color:#8fdfc0}

<script>

function refresh(){var A=window.ClarityNurArsenal;if(!A)return;show("sys-it",A.read("itBridge"));show("sys-om",A.read("omVein"));show("sys-sec",A.read("securityLog"));show("sys-ops",A.read("pulse"));}
