<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Journey · Clarity University</title>
<style>
:root{--bg:#070c0a;--gold:#e0c56a;--text:#eaf3ee;--muted:rgba(234,243,238,.72);--line:rgba(224,197,106,.28)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100%}
.banner{position:sticky;top:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:.55rem .8rem;background:rgba(8,16,14,.96);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:#f3e6c0}
.brand img{width:32px;height:32px;border-radius:50%;border:1px solid var(--line)}
.brand strong{font-size:1rem;font-weight:800}
.brand small{display:block;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.main-link{font-size:.72rem;font-weight:700;padding:.32rem .65rem;border-radius:999px;border:1px solid var(--line);background:rgba(224,197,106,.14);color:var(--gold);text-decoration:none}
.wrap{max-width:42rem;margin:0 auto;padding:.8rem .7rem 2rem}
.pills{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:0 0 .8rem}
.pills a{font-size:.74rem;font-weight:650;padding:.38rem .75rem;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:#f3e6c0;text-decoration:none}
.pills a.here{background:rgba(224,197,106,.2);border-color:var(--gold)}
.card{padding:1rem;border-radius:16px;border:1px solid var(--line);background:rgba(16,24,20,.92);margin:.4rem 0}
.card h2{margin:.1rem 0 .4rem;color:#f3e6c0;font-size:1.1rem}
.card p{margin:0 0 .5rem;font-size:.82rem;line-height:1.45;color:var(--muted)}
.card a{color:var(--gold)}
.foot{text-align:center;font-size:.68rem;color:var(--muted);padding:1rem}
</style>
</head>
<body>
<header class="banner">
  <a class="brand" href="/campus/"><img src="/assets/curriculum/vault/admin/brand/clarity-university-insignia.svg" alt=""/><div><small>University</small><strong>Clarity University</strong></div></a>
  <a class="main-link" href="/">← Main</a>
</header>
<main class="wrap">
<nav class="pills">
  <a href="/campus/">Map</a>
  <a href="/campus/desk/">Desk</a>
  <a href="/lab/" >Lab</a>
  <a href="/vault/" >Vault</a>
  <a href="/journey/" class="here">Journey</a>
  <a href="/charter/" >Charter</a>
</nav>
<div class="card"><h2>Full Journey</h2><p>Seeker (Junior) → New Muslim → Daily → Da'i. One phase at a time. Checkmarks unlock the next module; phase quiz unlocks the next phase.</p><p><a href="/campus/desk/">→ Begin or continue on the Desk</a></p></div>
</main>
<footer class="foot">Educational only — not a fatwa.</footer>
</body>
</html>
