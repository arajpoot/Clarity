name: NurOS contract smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Static CI smoke
        run: node scripts/nuros-ci-smoke.mjs https://clarity-dawah.fyi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuros-smoke
          path: SMOKE_CI_*.json
