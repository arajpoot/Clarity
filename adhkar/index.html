<h1>Morning and evening</h1>
<p class="muted" id="when"></p>
<div class="card" id="set"></div>
<p class="muted"><a href="https://sunnah.com/hisn">Hisn al-Muslim on Sunnah.com</a></p>

</main>
<footer class="cu-note" style="text-align:center;padding:1rem">Educational only — not a fatwa. Verify on Quran.com / Sunnah.com. Ask a local scholar.</footer>
<script>
(function(){
  var h=new Date().getHours();
  var morning=h>=4&&h<12, evening=h>=15&&h<22;
  document.getElementById("when").textContent="Local hour "+h+" · "+(morning?"morning set":evening?"evening set":"either set is fine");
  var items=morning?[["أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ","We have entered the morning and the dominion belongs to Allah."],["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ","Glory is to Allah and praise is to Him."]]:[["أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ","We have entered the evening and the dominion belongs to Allah."],["أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ","I seek refuge in the perfect words of Allah."]];
  document.getElementById("set").innerHTML=items.map(function(x){return '<p class="ar">'+x[0]+'</p><p>'+x[1]+'</p>';}).join("");
})();
</script>
