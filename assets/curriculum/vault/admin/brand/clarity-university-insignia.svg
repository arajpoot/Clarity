<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Clarity University OS">
  <defs>
    <linearGradient id="cuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d48a"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a88420"/>
    </linearGradient>
    <linearGradient id="cuGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a3d30"/>
      <stop offset="100%" stop-color="#1a6b52"/>
    </linearGradient>
  </defs>
  <!-- Outer seal -->
  <circle cx="64" cy="64" r="60" fill="url(#cuGreen)" stroke="url(#cuGold)" stroke-width="3.5"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#cuGold)" stroke-width="1.2" opacity="0.85"/>
  <!-- Soft geometric ring -->
  <path fill="none" stroke="url(#cuGold)" stroke-width="1.2" opacity="0.55"
    d="M64 24 L76 34 L100 34 L88 52 L100 70 L76 70 L64 100 L52 70 L28 70 L40 52 L28 34 L52 34 Z"/>
  <!-- Inner medallion -->
  <circle cx="64" cy="64" r="30" fill="#0d4f3c" stroke="url(#cuGold)" stroke-width="2"/>
  <!-- Crescent moon of guidance (replaces star) -->
  <path fill="url(#cuGold)"
    d="M72 44
       A22 22 0 1 0 72 84
       A16 16 0 1 1 72 44
       Z"/>
  <!-- Small companion dot (hilal accent) -->
  <circle cx="82" cy="50" r="2.2" fill="#e8d48a" opacity="0.95"/>
  <text x="64" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#e8d48a" letter-spacing="1">CU OS</text>
</svg>
