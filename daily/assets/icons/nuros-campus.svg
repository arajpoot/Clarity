<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="g" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0d3d5c"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d78c"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#g)"/>
  <circle cx="32" cy="32" r="28.2" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
  <!-- ground line -->
  <path d="M14 50h36" fill="none" stroke="#f5e6b8" stroke-width="1.6" stroke-linecap="round"/>
  <!-- main hall -->
  <path d="M20 50V34h24v16" fill="none" stroke="#f5e6b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- onion dome (arcs) -->
  <path d="M20 34c0-2 4-10 12-10s12 8 12 10" fill="none" stroke="#f5e6b8" stroke-width="1.7" stroke-linecap="round"/>
  <!-- door -->
  <path d="M28 50v-8h8v8" fill="none" stroke="#f5e6b8" stroke-width="1.5"/>
  <!-- minaret left: simple column + balcony ring + crescent (open C shape, not cross) -->
  <path d="M16 50V22" fill="none" stroke="#f5e6b8" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M13.5 28h5" fill="none" stroke="#f5e6b8" stroke-width="1.4" stroke-linecap="round"/>
  <!-- crescent only: open arc, opening to the right — NOT a plus/cross -->
  <path d="M16 16.5c-2.8.2-4.5 2.5-4.2 5.1 1.6-1.4 3.6-1.5 5-.3" fill="none" stroke="#e8c65a" stroke-width="1.6" stroke-linecap="round"/>
</svg>