<style>
.mod-wrap{max-width:42rem;margin:0 auto;padding:0 .85rem 2.5rem}
.mod-nav{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0 1rem;font-size:.8rem}
.mod-nav a{padding:.25rem .55rem;border-radius:999px;border:1px solid rgba(201,168,76,.3);text-decoration:none;color:inherit}
.mod-card{margin:1rem 0;padding:1rem 1.1rem;border-radius:1rem;border:1px solid rgba(201,168,76,.32);background:rgba(255,255,255,.04)}
.mod-card h1{font-size:1.2rem;color:#e8d5a3;margin:0 0 .5rem}
.ar{font-family:"Noto Naskh Arabic",serif;font-size:1.12rem;line-height:1.9;direction:rtl;text-align:right}
.btn{display:inline-flex;padding:.45rem 1rem;border-radius:999px;border:0;background:#1e7d5e;color:#fff;font-weight:700;cursor:pointer;margin:.2rem}
.btn.ghost{background:transparent;border:1px solid rgba(201,168,76,.4);color:inherit}
.sub{font-size:.8rem;opacity:.88}
</style>
</head>
<body data-yawm="1">
<div class="mod-wrap">
<header style="display:flex;justify-content:space-between;align-items:center;padding:.65rem 0;border-bottom:1px solid rgba(201,168,76,.2)">
  <a href="/daily/" style="font-weight:800;color:#c9a84c;text-decoration:none">Clarity · Yawm</a>
  <span style="font-size:.85rem"><a href="/daily/">Hub</a> · <a href="/">Companion</a></span>
</header>
<nav class="mod-nav">
  <a href="/daily/modules/now/">Now</a>
  <a href="/daily/modules/deed/">Deed</a>
  <a href="/daily/modules/adhkar/">Adhkār</a>
  <a href="/daily/modules/tasbeeh/">Tasbeeh</a>
  <a href="/daily/modules/salah/">Farḍ</a>
  <a href="/daily/modules/light/">Light</a>
</nav>
<div class="mod-card">
  <h1>Do this today</h1>
  <p id="deed">…</p>
  <p id="st" class="sub">Not marked</p>
  <button type="button" class="btn" id="mark">Mark done</button>
  <button type="button" class="btn ghost" id="next">Another</button>
  <p class="sub" style="margin-top:.75rem">Mirror, not scoreboard. Acceptance is with Allah.</p>
</div>
<p class="sub">Educational only — not a fatwa.</p>
</div>
<script src="../../assets/daily.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
  /* prefer hub logic if daily.js exposes; else local */
  var KEY="clarity.daily.deed.v1";
  var DEEDS=[
    "Share one beneficial sentence from Qur'an or Sunnah with sincerity — or learn one āyah with meaning.",
    "Beneficial knowledge or a child who prays for you (Muslim 1631 · educational wording — confirm with a teacher).",
    "Remove harm from a path, or teach one useful skill for Allah's sake.",
    "Pray one ṣalāh with fuller calm in rukūʿ and sujūd.",
    "Seek forgiveness morning or evening with presence of heart.",
    "Enjoin truth gently — or stay silent if unsure of the source."
  ];
  function day(){var d=new Date();return d.toDateString()}
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){return{}}}
  function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
  var st=load();
  if(st.day!==day()) st={day:day(),i:Math.floor(Math.random()*DEEDS.length),done:false};
  function paint(){
    document.getElementById("deed").textContent=DEEDS[st.i%DEEDS.length];
    document.getElementById("st").textContent=st.done?"Marked done today":"Not marked";
  }
  paint();save(st);
  document.getElementById("mark").onclick=function(){st.done=true;save(st);paint()};
  document.getElementById("next").onclick=function(){st.i=(st.i+1)%DEEDS.length;st.done=false;save(st);paint()};
});
</script>
</body></html>
