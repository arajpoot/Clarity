<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Do this today · Yawm · Clarity</title>
<meta name="description" content="Do this today — Yawm module. Educational only — not a fatwa."/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/daily.css"/>
<style>
.mod-wrap{max-width:40rem;margin:0 auto;padding:0 .85rem 2rem}
.mod-nav a{margin-right:.5rem;font-size:.85rem}
.mod-card{margin:1rem 0;padding:1rem;border-radius:1rem;border:1px solid rgba(201,168,76,.32);background:rgba(255,255,255,.04)}
.mod-card h1{font-size:1.25rem;color:#e8d5a3;margin:0 0 .5rem}
.ar{font-family:"Noto Naskh Arabic",serif;font-size:1.15rem;line-height:1.9;direction:rtl;text-align:right}
.btn{display:inline-flex;padding:.45rem 1rem;border-radius:999px;border:0;background:#1e7d5e;color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid rgba(201,168,76,.4);color:inherit}
</style>
</head>
<body data-yawm="1">
<div class="mod-wrap">
<header class="daily-header" style="padding:.75rem 0">
  <a class="brand" href="/daily/">Clarity · Yawm</a>
  <div class="header-actions"><a href="/daily/">Hub</a> · <a href="/">Companion</a></div>
</header>
<nav class="mod-nav" aria-label="Modules">
  <a href="/daily/">Hub</a>
  <a href="/daily/modules/now/">Now</a>
  <a href="/daily/modules/deed/">Deed</a>
  <a href="/daily/modules/adhkar/">Adhkār</a>
  <a href="/daily/modules/tasbeeh/">Tasbeeh</a>
  <a href="/daily/modules/salah/">Farḍ</a>
  <a href="/daily/modules/light/">Light</a>
</nav>
<div class="mod-card">
  <h1>Do this today</h1>
  <p id="deed-text">…</p>
  <p id="deed-status" class="cdl-sub">Not marked</p>
  <button type="button" class="btn" id="deed-mark">Mark done</button>
  <button type="button" class="btn ghost" id="deed-next">Another deed</button>
  <p style="margin-top:.75rem;font-size:.8rem;opacity:.85">Mirror, not scoreboard. Acceptance is with Allah. Educational only — not a fatwa.</p>
</div>
</div>
<script>
(function(){
  var KEY="clarity.daily.deed.v1";
  var DEEDS=[
    "Share one beneficial sentence from Qur'an or Sunnah with sincerity — or learn one āyah with meaning.",
    "Beneficial knowledge or a child who prays for you (Muslim 1631 · educational wording — confirm with a teacher).",
    "Give a small ongoing good: remove harm from a path, or teach one useful skill.",
    "Pray one ṣalāh with fuller calm in rukūʿ and sujūd.",
    "Seek forgiveness morning or evening with presence of heart."
  ];
  function day(){var d=new Date();return d.getFullYear()+"-"+ (d.getMonth()+1)+"-"+d.getDate()}
  function load(){
    try{return JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){return {}}
  }
  function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
  var st=load();
  if(st.day!==day()){st={day:day(),i:Math.floor(Math.random()*DEEDS.length),done:false}}
  function paint(){
    document.getElementById("deed-text").textContent=DEEDS[st.i%DEEDS.length];
    document.getElementById("deed-status").textContent=st.done?"Marked done today":"Not marked";
  }
  paint();save(st);
  document.getElementById("deed-mark").onclick=function(){st.done=true;save(st);paint()};
  document.getElementById("deed-next").onclick=function(){st.i=(st.i+1)%DEEDS.length;st.done=false;save(st);paint()};
})();
</script>
</body></html>
