<script>
(function(){
  var h=new Date().getHours();
  var w,d;
  if(h>=4&&h<12){w="Morning";d="Morning window — adhkār, intention, prepare the day with remembrance.";}
  else if(h>=12&&h<17){w="Afternoon";d="Afternoon — guard the prayer, keep a light tongue.";}
  else if(h>=17&&h<20){w="Evening";d="Evening window — adhkār, protect the heart, prepare the long stay.";}
  else{w="Night";d="Night — seek forgiveness, reduce harm, rest with dhikr.";}
  document.getElementById("lbl").textContent=w+" · "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  document.getElementById("detail").textContent=d;
})();
</script>
