<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Daily · Clarity</title>
<meta name="description" content="Today's deed, full adhkar, and seven-day history. On this device. Educational only — not a fatwa."/>
<link rel="canonical" href="https://clarity-dawah.fyi/daily/"/>
<link rel="stylesheet" href="/daily/assets/daily.css"/>
</head>
<body>
<header>
  <a href="/daily/">Clarity · Daily</a>
  <a href="/">Companion</a>
</header>
<nav>
  <a class="here" href="/daily/">Today</a>
  <a href="/campus/">Campus</a>
  <a href="/#reminder">Companion</a>
</nav>
<main>
  <p class="muted">Phase C · isolated. Full adhkar and deed history live here. Companion keeps its doors.</p>
  <div class="card">
    <p class="muted">Do this today · <span id="d-period"></span></p>
    <h1>One deed</h1>
    <p id="d-deed"></p>
    <p class="muted" id="d-done"></p>
    <button type="button" id="d-mark">Mark done</button>
  </div>
  <h2>Adhkar</h2>
  <div id="d-adhkar"></div>
  <div class="card">
    <p class="muted">Tasbeeh · today</p>
    <p>Count <strong id="d-tas">0</strong></p>
    <button type="button" id="d-tas-inc">+1</button>
    <button type="button" id="d-tas-reset">Reset</button>
  </div>
  <div class="card">
    <p class="muted">Last seven days</p>
    <div id="d-hist"></div>
  </div>
</main>
<script src="/daily/assets/daily.js"></script>
</body>
</html>
