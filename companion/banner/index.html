<!DOCTYPE html>
<html lang="en" data-clarity-room="companion-banner">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Companion Banner · Clarity</title>
<meta name="description" content="Self-contained Clarity Companion banner: Hijrī calendar, ṣalāh times, Ḥaramain still/live. Educational only — not a fatwa."/>
<link rel="canonical" href="https://clarity-dawah.fyi/companion/banner/"/>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, sans-serif; background:#0c1c16; color:#e8f0ec; }
.banner { max-width: 56rem; margin: 0 auto; padding: 0.75rem; }
.banner-media { position: relative; border-radius: 16px; overflow: hidden; min-height: 12rem;
  border: 1px solid rgba(212,180,90,0.3); background: #000; }
.banner-live-iframe, .banner-still-img { width: 100%; min-height: 12rem; border: 0; display: block; object-fit: cover; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.75rem; }
@media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
.plaque { border-radius: 14px; border: 1px solid rgba(212,180,90,0.28); background: rgba(15,76,58,0.2); padding: 0.75rem; }
.hijri-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; margin-top: 0.5rem; }
.hijri-day { text-align: center; font-size: 0.75rem; padding: 0.25rem; border-radius: 6px; background: rgba(0,0,0,0.25); }
.hijri-day.is-today { background: rgba(30,125,94,0.55); font-weight: 700; color: #e8d5a3; }
.salah-times-list { list-style: none; margin: 0.5rem 0 0; padding: 0; }
.salah-row { display: flex; justify-content: space-between; padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.85rem; }
.salah-row.is-next .salah-name { color: #e8d5a3; font-weight: 700; }
.controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; align-items: center; }
button, select { border-radius: 999px; border: 1px solid rgba(212,180,90,0.35); background: rgba(30,125,94,0.4); color: inherit; padding: 0.35rem 0.75rem; font-weight: 600; cursor: pointer; }
.disc { font-size: 0.72rem; opacity: 0.85; margin-top: 0.75rem; }
</style>
</head>
<body>
<main class="banner" id="clarity-final-banner-controls-v2">
  <div class="banner-media" id="banner-media">
    <iframe id="banner-live" class="banner-live-iframe" title="Ḥaramain live" hidden></iframe>
    <img id="banner-img" class="banner-still-img" alt="Masjid al-Haram" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Kaaba_Masjid_Haraam_Makkah.jpg/1280px-Kaaba_Masjid_Haraam_Makkah.jpg"/>
  </div>
  <div class="controls">
    <button type="button" id="live-haramain-btn" aria-pressed="false"><span id="live-haramain-label">Still</span></button>
    <label>Place
      <select id="live-place-select" aria-label="Ḥaramain place">
        <option value="makkah">Makkah</option>
        <option value="madinah">Madinah</option>
      </select>
    </label>
    <label>Volume <input type="range" id="volume-slider" min="0" max="100" value="82"/></label>
    <select id="stream-select" aria-label="Radio stream">
      <option value="https://qurango.net/radio/tarateel">Tarateel</option>
      <option value="https://qurango.net/radio/maher">Maher</option>
    </select>
    <select id="surah-list-pill" aria-label="Surah"><option value="">Surah…</option>
      <option value="1">1 Al-Fātiḥah</option><option value="36">36 Yā-Sīn</option><option value="67">67 Al-Mulk</option>
    </select>
    <button type="button" id="stream-btn" onclick="window.changeStream&&window.changeStream()">Next stream</button>
  </div>
  <div class="row">
    <section class="plaque hijri-cal-section" aria-label="Hijrī calendar">
      <h2 id="hijri-cal-title" class="salah-title">Hijrī</h2>
      <p id="hijri-cal-meta" class="disc">Loading calendar…</p>
      <div id="hijri-temps" class="hijri-temps"></div>
      <div id="hijri-cal-grid" class="hijri-cal-grid"></div>
      <p id="hijri-next-event" class="hijri-next-event"></p>
    </section>
    <section class="plaque salah-times-section" aria-label="Ṣalāh times">
      <h2 id="salah-title" class="salah-title">Ṣalāh</h2>
      <p id="hijri-local-loc" class="disc">City</p>
      <p id="hijri-local-time"></p>
      <ul id="salah-times-list" class="salah-times-list"></ul>
      <label class="disc"><input type="checkbox" id="azan-notify-toggle"/> Azan notify (device only)</label>
    </section>
  </div>
  <p class="disc">Educational companion only — not a fatwa. Times from public APIs; confirm locally. Live streams depend on upstream availability; still images are fallbacks.</p>
  <p class="disc"><a href="/companion/" style="color:#c9a84c">← Companion</a></p>
</main>
<script src="/companion/assets/banner/companion-banner-owner-v1.js?v=20261108C5"></script>
<script src="/companion/assets/banner/companion-banner-audio-v1.js?v=20261108C5a"></script>
</body>
</html>
