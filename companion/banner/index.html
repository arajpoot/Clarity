</section>

          <option value="">📖 Surahs…</option>

          <option value="afs">Alafasy</option>
          <option value="basit">Abdul Basit</option>
          <option value="sds">As-Sudais</option>
          <option value="maher">Maher</option>
          <option value="ajm">Al-Ajmy</option>
          <option value="ghamdi">Al-Ghamdi</option>
          <option value="husary">Al-Husary</option>
          <option value="minshawi">Minshawi</option>
        </select>
        <button type="button" class="pill pill-icon" id="btn-surah-play" title="Play surah" aria-label="Play surah">▶</button>
        <button type="button" class="pill pill-icon" id="btn-surah-stop" title="Stop" aria-label="Stop audio">■</button>
        <input type="range" id="volume-slider" class="pill-vol" min="0" max="100" value="82" aria-label="Volume"/>
        <select id="live-place-select" hidden>
